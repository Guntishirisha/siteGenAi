<style>
:root{--bg:#0b0f1a;--p1:#121a2b;--p2:#1a2438;--ln:#26324a;--tx:#f3efe6;--mu:#93a0b8;--ac:#ff5a1f;--ok:#3ddc97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f1e8;--p1:#ffffff;--p2:#efe9dc;--ln:#ddd5c3;--tx:#111827;--mu:#5b6474;--ok:#12805c}}
:root[data-theme="light"]{--bg:#f5f1e8;--p1:#ffffff;--p2:#efe9dc;--ln:#ddd5c3;--tx:#111827;--mu:#5b6474;--ok:#12805c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--ln);background:var(--p1);flex-wrap:wrap}
.logo{font:700 20px 'Space Grotesk',sans-serif;margin-right:8px}.logo b{color:var(--ac)}
#name{background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 10px;font-weight:600;width:200px}#name:hover,#name:focus{border-color:var(--ln);outline:0}
.sp{flex:1}
.btn{border:1px solid var(--ln);background:var(--p2);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;transition:.15s}

.btn.p{background:var(--ac);border-color:var(--ac);color:#111827}
select.btn{padding:8px 10px}
.seg{display:flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden}.seg button{border:0;background:transparent;padding:8px 11px;font-size:14px}.seg button.on{background:var(--ac);color:#111827}
.grp{display:contents}body.land .wo{display:none}.vd{font-size:11px;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--ln)}.vd.convert{background:var(--ok);color:#111827}.vd.hesitate{background:#f5b301;color:#111827}.vd.leave{background:#ff5a1f;color:#111827}#tb{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:4px;z-index:2;background:var(--p1);border:1px solid var(--ln);border-radius:999px;padding:5px;box-shadow:0 8px 30px #0006}#tb button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600}#tb button:hover{background:var(--p2)}.tab{font-size:13px}.tg{display:flex;align-items:center;gap:10px}.sw2{width:44px;height:24px;border-radius:12px;background:var(--ln);position:relative;border:0;flex:none}.sw2.on{background:var(--ok)}.sw2 i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw2.on i{left:23px}.tab{padding:13px 2px;font-size:12.5px}a.sm{display:block;text-decoration:none;padding:9px 10px}.th2{margin:30px 0 12px;font:700 18px 'Space Grotesk',sans-serif;text-align:left}.tpl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.tp{border:1px solid var(--ln);background:var(--p1);border-radius:16px;overflow:hidden;text-align:left;padding:0;transition:.15s}.tp:hover{border-color:var(--ac);transform:translateY(-3px)}.tp .pv{height:92px}.tp b{display:block;padding:10px 12px 0}.tp span{display:block;padding:0 12px 12px;font-size:12.5px;color:var(--mu)}body.foc .chat,body.foc .insp{display:none}body.foc #ws{grid-template-columns:1fr}
/* landing */
#land{flex:1;overflow:auto;position:relative;display:grid;place-items:center;padding:40px 20px}
body:not(.land) #land{display:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.35;animation:fl 12s ease-in-out infinite alternate;pointer-events:none}
.o1{width:480px;height:480px;background:var(--ac);left:-120px;top:-100px}.o2{width:420px;height:420px;background:#6d5cff;right:-100px;bottom:-80px;animation-delay:-5s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.lw{position:relative;max-width:860px;width:100%;text-align:center}
.eye{font-size:13px;font-weight:700;letter-spacing:4px;color:var(--ac)}
.lw h1{font:700 clamp(40px,7vw,76px)/1.04 'Space Grotesk',sans-serif;margin:14px 0}.lw h1 em{font-style:normal;color:var(--ac)}
.lw>p{color:var(--mu);font-size:19px;margin:0 auto 28px;max-width:600px}
.comp{background:var(--p1);border:1px solid var(--ln);border-radius:20px;padding:14px;text-align:left;box-shadow:0 20px 60px #0005}
.comp textarea,.cin textarea{width:100%;background:transparent;border:0;resize:none;outline:0;font-size:17px;height:84px;padding:6px}
.cr{display:flex;gap:8px;align-items:center}
.egs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:18px}
.eg{text-align:left;background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:14px;font-size:14px;color:var(--tx);transition:.15s}.eg:hover{border-color:var(--ac);transform:translateY(-2px)}.eg span{display:block;font-size:26px;margin-bottom:6px}
.bd{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}.bd i{font-style:normal;font-size:13px;color:var(--mu);border:1px solid var(--ln);border-radius:999px;padding:6px 12px}
/* workspace */
#ws{flex:1;display:grid;grid-template-columns:330px 1fr 340px;min-height:0}
body.land #ws{display:none}
.chat,.insp{display:flex;flex-direction:column;min-height:0;background:var(--p1)}.chat{border-right:1px solid var(--ln)}.insp{border-left:1px solid var(--ln)}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:90%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m.u{align-self:flex-end;background:var(--ac);color:#111827;border-bottom-right-radius:4px}.m.a{align-self:flex-start;background:var(--p2);border-bottom-left-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}.chips button{border:1px solid var(--ln);background:transparent;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--mu)}.chips button:hover{border-color:var(--ac);color:var(--tx)}
.cin{border-top:1px solid var(--ln);padding:10px 12px;display:flex;flex-direction:column;gap:6px}.cin textarea{height:56px;font-size:14px;background:var(--p2);border-radius:10px;padding:10px}
.canvas{position:relative;background:var(--bg);padding:16px;min-width:0;display:flex;justify-content:center;align-items:stretch}
.canvas .fr{width:100%;max-width:100%;transition:width .3s;display:flex}.canvas iframe{flex:1;border:1px solid var(--ln);border-radius:14px;background:#fff;min-height:0;box-shadow:0 12px 40px #0004}
#pipe{position:absolute;inset:16px;border-radius:14px;background:var(--p1);display:none;place-items:center;z-index:3}#pipe.on{display:grid}
#pipe ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:14px;font-size:18px}
#pipe li{display:flex;gap:12px;align-items:center;color:var(--mu);transition:.3s}#pipe li i{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-style:normal;font-size:14px}
#pipe li.on{color:var(--tx)}#pipe li.on i{border-color:var(--ac);animation:pl 1s infinite}#pipe li.done{color:var(--tx)}#pipe li.done i{background:var(--ok);border-color:var(--ok);color:#111827}
@keyframes pl{50%{box-shadow:0 0 0 6px #ff5a1f33}}
.tabs{display:flex;border-bottom:1px solid var(--ln)}.tab{flex:1;border:0;background:none;padding:13px 6px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent}.tab.on{color:var(--tx);border-color:var(--ac)}
.ib{flex:1;overflow:auto;padding:14px}
.card{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;gap:6px;align-items:center}.tag{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase}
.card input,.card textarea,.pop input{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%}.card textarea{resize:vertical;min-height:64px}
.sm{border:1px solid var(--ln);background:var(--bg);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}.sm:hover{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sw{height:44px;border-radius:10px;border:2px solid var(--ln);font-size:10px;font-weight:700;display:grid;place-items:end center;padding-bottom:3px}.sw.on{border-color:var(--ac)}
h4{margin:14px 0 8px;font-size:12px;letter-spacing:1.5px;color:var(--mu);text-transform:uppercase}
.opt{display:flex;gap:6px}.opt button{flex:1;border:1px solid var(--ln);background:var(--p2);border-radius:9px;padding:8px;font-size:13px}.opt button.on{border-color:var(--ac);background:#ff5a1f22}
.cp{display:flex;gap:8px}.cp label{flex:1;font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px}.cp input{width:100%;height:34px;border:1px solid var(--ln);border-radius:8px;background:none;padding:2px}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;margin:4px auto 16px}.ring div{width:108px;height:108px;border-radius:50%;background:var(--p1);display:grid;place-items:center;font:700 40px 'Space Grotesk',sans-serif;line-height:1;text-align:center}.ring small{display:block;font:500 12px Inter;color:var(--mu)}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin:6px 0 3px}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}.ci small{color:var(--mu);font-size:12.5px}
.pop{position:fixed;right:16px;top:64px;width:340px;max-width:calc(100% - 32px);background:var(--p1);border:1px solid var(--ln);border-radius:14px;padding:16px;box-shadow:0 16px 50px #0006;z-index:9;display:none;flex-direction:column;gap:8px;font-size:14px}.pop.on{display:flex}.pop .it{padding:8px;border:1px solid var(--ln);border-radius:8px;cursor:pointer}.pop .it:hover{border-color:var(--ac)}
body.ro .chat,body.ro .insp,body.ro .rm{display:none}body.ro #ws{grid-template-columns:1fr}
@media(max-width:1100px){body{overflow:auto}#ws{grid-template-columns:1fr;grid-auto-rows:auto}.canvas{height:70vh}.chat{height:380px}.insp{height:480px}}
</style></head>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={guard:true,ledger:[],brief:'',tt:null,stage:null,spec:null,id:null,tab:'sec',busy:false,msgs:[],past:[],future:[],name:'Untitled site',sample:null,db:null,dl:null,uid:null};
const TY='hero|about|features|gallery|stats|pricing|testimonials|faq|contact';
const SCHEMA=`Return ONLY valid JSON (no markdown): {"title":str,"theme":{"primary":"#hex","bg":"#hex","text":"#hex","font":"sans|serif|mono","radius":14,"space":1},"sections":[{"type":"${TY}","heading":str,"body":str,"items":[{"title":str,"text":str}],"cta":str}]}. Use 6-8 sections: hero first, contact last. Write specific, vivid, realistic copy with a clear brand voice (no lorem ipsum, no generic filler). Hero needs a cta label. features/gallery/pricing/testimonials/faq need 3-4 items; stats items use title as the number (e.g. "12k+") and text as the label; contact items use titles Email, Phone, Address with plausible fictional values. Pick a distinctive palette with text/background contrast of at least 4.5:1.`;
const EG=[['🍽️','Restaurant with menu, gallery and contact'],['📸','Portfolio for a wedding photographer'],['💪','Landing page for a fitness tracking app'],['🏥','Modern dental clinic with booking info'],['🚀','SaaS startup landing page with pricing'],['🎉','Event page for a college tech fest']];
const PRE=[['Sunset','#ff5a1f','#fffaf5','#1a1a1a'],['Ocean','#0e7490','#f0fbff','#0b2530'],['Forest','#166534','#f4faf5','#10241a'],['Midnight','#8b5cf6','#0f1020','#ecebff'],['Noir','#facc15','#0b0b0b','#f5f5f5'],['Rose','#e11d48','#fff5f7','#2a0a12'],['Mono','#111827','#ffffff','#111827'],['Sand','#b45309','#faf5ea','#2b2112'],['Coral','#f43f5e','#fff7f5','#2b1215'],['Lime','#65a30d','#fbfdf4','#1a2305'],['Indigo','#4338ca','#f5f6ff','#14163a'],['Teal','#0d9488','#f2fdfb','#06312d'],['Slate','#475569','#f8fafc','#0f172a'],['Gold','#ca8a04','#fffdf2','#2a2003'],['Berry','#a21caf','#fdf4ff','#2e0a33'],['Carbon','#22d3ee','#0a0f14','#e8f7fb']];
const CHIPS=['Make copy bolder','Add an FAQ section','Add pricing','More professional tone','Add stats section','Shorten all text'];
const lum=h=>{const[r,g,b]=[1,3,5].map(i=>{const v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)},onC=h=>lum(h)>.4?'#111827':'#ffffff';
function norm(sp){const t=sp.theme||{},hx=(v,d)=>/^#[0-9a-f]{6}$/i.test(v||'')?v:d;
 sp.theme={primary:hx(t.primary,'#ff5a1f'),bg:hx(t.bg,'#ffffff'),text:hx(t.text,'#111827'),font:['serif','mono'].includes(t.font)?t.font:'sans',radius:[4,14,28].includes(+t.radius)?+t.radius:14,space:[.7,1,1.35].includes(+t.space)?+t.space:1,art:['none','waves','grid','rays','peaks'].includes(t.art)?t.art:'blobs'};
 sp.title=sp.title||'My website';sp.sections=(sp.sections||[]).map(s=>({type:TY.split('|').includes(s.type)?s.type:'about',heading:s.heading||'',body:s.body||'',items:Array.isArray(s.items)?s.items:[],cta:s.cta||''}));return sp}
function site(sp){const t=sp.theme,bt=onC(t.primary),F={sans:'system-ui,Arial,sans-serif',serif:'Georgia,serif',mono:'ui-monospace,Menlo,monospace'}[t.font];
 const G=(a,fn)=>`<div class="g">${a.map(fn).join('')}</div>`;
 const sec=s=>{const h=`<h2>${esc(s.heading)}</h2>`,p=s.body?`<p class="lead">${esc(s.body)}</p>`:'',I=s.items;
 switch(s.type){
 case'hero':return `<header class="hero"><h1>${esc(s.heading)}</h1><p>${esc(s.body)}</p>${s.cta?`<a class="b" href="#contact">${esc(s.cta)}</a>`:''}</header>`;
 case'gallery':return `<section>${h}${p}${G(I,(x,i)=>`<div class="tile" style="background:${ART(['waves','peaks','blobs','rays','grid'][i%5],t.primary,bt)} center/cover,linear-gradient(${40+i*47}deg,${t.primary},${t.primary}66)"><span>${esc(x.title)}</span></div>`)}</section>`;
 case'stats':return `<section class="st">${h}${G(I,x=>`<div class="n"><b>${esc(x.title)}</b><span>${esc(x.text)}</span></div>`)}</section>`;
 case'pricing':return `<section>${h}${p}${G(I,(x,i)=>`<div class="c ${i==1?'hl':''}"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`)}</section>`;
 case'faq':return `<section>${h}${I.map(x=>`<details class="c"><summary>${esc(x.title)}</summary><p>${esc(x.text)}</p></details>`).join('')}</section>`;
 case'testimonials':return `<section>${h}${G(I,x=>`<blockquote class="c">“${esc(x.text)}”<footer>— ${esc(x.title)}</footer></blockquote>`)}</section>`;
 case'contact':return `<section id="contact">${h}${p}<ul>${I.map(x=>`<li><b>${esc(x.title)}</b> ${esc(x.text)}</li>`).join('')}</ul></section>`;
 default:return `<section>${h}${p}${I.length?G(I,x=>`<div class="c"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div>`):''}</section>`}};
 return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="${esc((sp.sections[0]?.body||'').slice(0,155))}"><title>${esc(sp.title)}</title><style>
*{box-sizing:border-box}body{margin:0;background:${t.bg};color:${t.text};font-family:${F};line-height:1.65}
section{padding:calc(70px*${t.space}) 7%;max-width:1120px;margin:0 auto}h1,h2,h3{line-height:1.12}h2{font-size:clamp(26px,4vw,40px);margin:0 0 14px}.lead{font-size:18px;opacity:.85;max-width:680px}
.hero{background:${ART(t.art,t.primary,bt)} center/cover no-repeat,radial-gradient(circle at 85% 10%,#ffffff44,transparent 45%),radial-gradient(circle at 0 100%,#00000033,transparent 50%),${t.primary};color:${bt};padding:calc(120px*${t.space}) 7%;text-align:center}
.hero h1{font-size:clamp(36px,7vw,68px);margin:0 auto 18px;max-width:900px;animation:r .8s both}.hero p{max-width:640px;margin:0 auto 30px;font-size:20px;animation:r .8s .15s both}.hero .b{animation:r .8s .3s both}
@keyframes r{from{opacity:0;transform:translateY(18px)}}@media(prefers-reduced-motion){*{animation:none!important}}
.b{display:inline-block;background:${bt};color:${t.primary};padding:15px 30px;border-radius:${t.radius*2}px;text-decoration:none;font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:26px}
.c{border:1px solid ${t.text}2a;border-radius:${t.radius}px;padding:22px;margin:0 0 12px;background:${t.text}08}.c h3{margin:0 0 6px}.c p{margin:0}.hl{border:2px solid ${t.primary};background:${t.primary}14}
summary{font-weight:700;cursor:pointer}details p{margin-top:8px}
.tile{min-height:180px;border-radius:${t.radius}px;display:flex;align-items:flex-end;padding:18px;color:${bt};font-weight:700}
